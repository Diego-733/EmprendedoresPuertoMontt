# Entrega 7: envía los avisos pendientes (invitaciones, recordatorios, avisos de
# feria, seguidores y contactos) por Firebase Cloud Messaging.
# Usa una cuenta propia registrada en la tabla notificadores (NO la service_role).
# Si faltan los secretos, termina sin error y avisa: no inventa envíos.
# Para una demostración en vivo: `npm run notificar:vigilar` en un computador del grupo.
name: Enviar avisos

# Desactivado por defecto: solo se ejecuta a mano ("Run workflow"). La instancia del curso
# tiene capacidad desconocida; activar el cron solo después de configurar los secretos y
# acordar su uso con el administrador. Cada ejecución hace 1 inicio de sesión + 1 consulta
# a la cola (+ 1 por aviso enviado). Para activarlo, quitar los # de las dos líneas de abajo.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: notificador
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar avisos pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NOTIFICADOR_EMAIL: ${{ secrets.NOTIFICADOR_EMAIL }}
          NOTIFICADOR_CLAVE: ${{ secrets.NOTIFICADOR_CLAVE }}
          FIREBASE_CUENTA_SERVICIO: ${{ secrets.FIREBASE_CUENTA_SERVICIO }}
        run: |
          if [ -z "$NOTIFICADOR_EMAIL" ] || [ -z "$FIREBASE_CUENTA_SERVICIO" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::notice::El servicio de envío no está configurado (faltan secretos). No se envió nada. Ver docs/entrega7/README.md"
            exit 0
          fi
          node servicios/notificador/enviar.js
